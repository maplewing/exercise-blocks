<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff4f95" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2a0a1b" media="(prefers-color-scheme: dark)">
  <meta name="application-name" content="Exercise Blocks">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Exercise Blocks">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>Exercise Blocks</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span style="top:6%;left:8%;font-size:18px;animation-delay:0s">✦</span>
    <span style="top:14%;left:82%;font-size:26px;animation-delay:.8s">✦</span>
    <span style="top:30%;left:92%;font-size:14px;animation-delay:2s">✧</span>
    <span style="top:42%;left:4%;font-size:22px;animation-delay:1.4s">✧</span>
    <span style="top:58%;left:88%;font-size:20px;animation-delay:.4s">✦</span>
    <span style="top:70%;left:10%;font-size:16px;animation-delay:2.4s">✦</span>
    <span style="top:84%;left:70%;font-size:24px;animation-delay:1.1s">✧</span>
    <span style="top:92%;left:20%;font-size:18px;animation-delay:1.8s">✦</span>
  </div>

  <main>
    <header>
      <h1><span class="sp sp1" aria-hidden="true">✦</span> Exercise Blocks <span class="sp sp2" aria-hidden="true">✦</span></h1>
      <nav role="tablist">
        <button role="tab" data-tab="plan" aria-selected="true">Today</button>
        <button role="tab" data-tab="history" aria-selected="false">History</button>
      </nav>
    </header>

    <section id="plan"></section>
    <section id="history" hidden></section>
  </main>

  <script src="exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
